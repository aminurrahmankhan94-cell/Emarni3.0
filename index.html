<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Emarni Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Loading screen -->
  <div class="splash" id="splash" aria-label="Loading Emarni">
    <div class="loader"><span class="ring r1"></span><span class="ring r2"></span><span class="ring r3"></span><span class="core">E</span></div>
    <h1>Emarni</h1>
    <p>Preparing your space</p>
    <div class="bar"><i></i></div>
  </div>

  <!-- Sign in / Register -->
  <main class="auth hidden" id="auth">
    <form class="card" id="authForm">
      <h2 id="authTitle">Welcome back</h2>
      <input id="name" class="hidden" placeholder="Display name" minlength="2" maxlength="32" autocomplete="nickname" />
      <input id="email" type="email" placeholder="Email" required autocomplete="email" />
      <input id="password" type="password" placeholder="Password (min 6 characters)" minlength="6" required autocomplete="current-password" />
      <button class="btn" id="authBtn">Sign in</button>
      <button class="link" id="switchBtn" type="button">New to Emarni? Create an account</button>
      <p class="error" id="authError"></p>
    </form>
  </main>

  <!-- Main app -->
  <div class="app hidden" id="app">
    <aside class="side">
      <div class="me">
        <div class="avatar" id="meAvatar">E</div>
        <div class="me-info"><strong id="meName"></strong><small id="meId"></small></div>
        <button class="link" id="signOut" type="button">Sign out</button>
      </div>

      <form class="add" id="addForm">
        <input id="addId" placeholder="Add friend by Emarni ID" maxlength="12" autocomplete="off" />
        <button class="btn sm">Add</button>
      </form>

      <h3>Requests</h3>
      <ul class="list" id="requests"></ul>
      <h3>Friends</h3>
      <ul class="list" id="friends"></ul>
    </aside>

    <section class="chat">
      <header class="head">
        <button class="icon" id="back" type="button" aria-label="Back">&#8249;</button>
        <strong id="chatTitle">Select a friend</strong>
      </header>
      <div class="messages" id="messages"><p class="empty">Pick a friend to start a private chat.</p></div>
      <form class="composer hidden" id="composer">
        <input id="text" placeholder="Type a message" maxlength="1000" autocomplete="off" />
        <button class="btn">Send</button>
      </form>
    </section>
  </div>

  <!-- Report dialog -->
  <dialog id="reportDlg">
    <h3>Report message</h3>
    <p class="hint">Reports are sent securely to the Emarni moderation team.</p>
    <select id="reason">
      <option>Spam or scam</option>
      <option>Harassment or abuse</option>
      <option>Hate or threats</option>
      <option>Inappropriate content</option>
      <option>Other</option>
    </select>
    <div class="row">
      <button class="link" id="reportCancel" type="button">Cancel</button>
      <button class="btn" id="reportSend" type="button">Send report</button>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
